name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  publish:
    name: publish GitHub Release with signed-off artifacts
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      PREFIX: /tmp/ffmpega64
      FFPREFIX: /tmp/ffmpega64
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install NDK r27c (preinstalled runner SDK)
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;27.2.12479018" > /dev/null
          echo "NDK=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"

      - name: Set up Rust (aarch64-linux-android)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Install libclang + pkg-config
        run: |
          sudo apt-get update
          sudo apt-get install -y libclang-dev clang pkg-config curl xz-utils make

      - name: Fetch FFmpeg 7.1.1 source
        run: |
          curl -sSLo /tmp/ffmpeg.tar.xz https://ffmpeg.org/releases/ffmpeg-7.1.1.tar.xz
          mkdir -p /tmp/ffsrc && tar xf /tmp/ffmpeg.tar.xz -C /tmp/ffsrc --strip-components=1

      - name: Build FFmpeg for Android aarch64 (LGPL config)
        env:
          SRC: /tmp/ffsrc
        run: sh scripts/ffmpeg-android.sh

      - name: Fetch engine at pinned commit + build JNI bridge
        run: sh scripts/build-bridge-android.sh

      - name: 16KB page-size gate (dlopen compatibility on Android 15+ devices)
        run: |
          # v0.1.1 root-cause lesson: a 4KB-aligned liboveandroid.so fails to
          # dlopen on 16KB-page kernels — the app loads but every engine call
          # dies ("engine bridge failure", nothing created). Refuse to ship.
          SO=app/src/main/jniLibs/arm64-v8a/liboveandroid.so
          ALIGN="$(readelf -W -l "$SO" | awk '/ LOAD / {print $NF; exit}')"
          echo "$SO LOAD alignment: $ALIGN"
          case "$ALIGN" in
            0x4000|0x8000|0x10000|0x20000) echo "16KB-compatible ✓" ;;
            *) echo "::error::$SO LOAD alignment $ALIGN is NOT 16KB-compatible — refusing to publish"; exit 1 ;;
          esac

      - name: Restore release keystore from secrets (never committed)
        env:
          KS_B64: ${{ secrets.OVE_ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > /tmp/ove-release.keystore
            echo "OVE_KEYSTORE_PATH=/tmp/ove-release.keystore" >> "$GITHUB_ENV"
            echo "release keystore restored (signing: release key)"
          else
            echo "no keystore secret present — build falls back to debug signing (installable, recorded honestly)"
          fi

      - name: Release build (APK + AAB)
        env:
          OVE_KEYSTORE_PASSWORD: ${{ secrets.OVE_ANDROID_KEYSTORE_PASSWORD }}
          OVE_KEY_ALIAS: ${{ secrets.OVE_ANDROID_KEY_ALIAS }}
          OVE_KEY_PASSWORD: ${{ secrets.OVE_ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleRelease bundleRelease --no-daemon

      - name: Verify APK signature (never publish unsigned — v0.1.0 lesson)
        run: |
          APKSIGNER="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner"
          APK=$(ls app/build/outputs/apk/release/*.apk)
          echo "verifying: $APK"
          "$APKSIGNER" verify --print-certs "$APK" | tee /tmp/certs.txt
          grep -q 'certificate SHA-256 digest' /tmp/certs.txt || {
            echo "::error::APK has no verifiable signing certificate — refusing to publish"
            exit 1
          }
          echo "OVE_SIGNER_SHA256=$(sed -n 's/.*certificate SHA-256 digest: //p' /tmp/certs.txt | head -1)" >> "$GITHUB_ENV"

      - name: Checksums + metadata
        run: |
          # Fresh dist dir: stale committed artifacts must never ride into a
          # release (v0.1.1 lesson — an old unsigned APK leaked onto the page).
          rm -rf dist && mkdir -p dist
          cp app/build/outputs/apk/release/*.apk dist/
          cp app/build/outputs/bundle/release/*.aab dist/
          cd dist
          sha256sum * > SHA256SUMS.txt
          {
            echo "source_commit: $GITHUB_SHA"
            echo "engine_pin: 06c92496f7051f15069663296ec51e88e170fe18"
            echo "bridge_version: 0.1.0"
            echo "app_version: ${GITHUB_REF_NAME#v}"
            echo "libav: FFmpeg 7.1.1 LGPL (aarch64)"
            echo "signer_sha256: ${OVE_SIGNER_SHA256:-unverified}"
            echo "abi: arm64-v8a"
            echo "min_sdk: 26 (Android 8.0)"
          } > build-metadata.yml

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          body: |
            OVE Studio (Android client of Open Video Engine) ${GITHUB_REF_NAME}

            - Engine dependency: open-video-engine @ 06c9249 (code-identical to v0.2.0)
            - libav: FFmpeg 7.1.1, LGPL configuration, arm64-v8a
            - APK is **signed** (release keystore held in CI secrets, never committed)
            - Requires Android 8.0+ (minSdk 26), arm64-v8a device
            - Verify with SHA256SUMS.txt (sha256sum -c); signer fingerprint in build-metadata.yml
