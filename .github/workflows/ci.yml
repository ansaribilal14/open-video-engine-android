name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  kotlin:
    name: kotlin unit tests + debug build
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Accept SDK licenses (preinstalled runner SDK)
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Kotlin unit tests + debug build
        run: ./gradlew testDebugUnitTest assembleDebug --no-daemon

  bridge-host:
    name: bridge host build + real-operation e2e (deterministic mpeg4 fixture)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      # Ubuntu 24.04 ships FFmpeg 6.1 — the engine pins 7.1. Use the engine's
      # own CI mechanism: ffmpeg-sys-next `bundled` compiles the pinned FFmpeg
      # from source (ove-decode/ove-encode `bundled` features).
      - name: Install toolchain (clang, nasm, ffmpeg CLI, libclang)
        run: |
          sudo apt-get update
          sudo apt-get install -y libclang-dev clang pkg-config nasm ffmpeg make

      - name: Fetch engine at pinned commit (read-only checkout)
        run: sh bridge/fetch-engine.sh

      - name: Bridge e2e — create/import/edits/undo/redo/render/export/reopen (bundled FFmpeg 7.1)
        run: |
          cd bridge
          cargo test --release --test e2e --features ove-decode/bundled,ove-encode/bundled -- --nocapture

      - name: Certified real-media gate (NASA source, optional)
        env:
          OVE_E2E_MEDIA: /tmp/source.mp4
        run: |
          # The certification-grade source (sha256 2d315daf…705f) is acquired
          # out-of-band (see engine repo docs/REALWORLD_VALIDATION.md); when a
          # cache artifact is attached to the run it is identity-gated and the
          # H.264 typed-capability journey runs against it.
          if [ -f "$OVE_TEST_MEDIA_CACHE" ]; then
            cp "$OVE_TEST_MEDIA_CACHE" /tmp/source.mp4
            sha256sum /tmp/source.mp4
            cd bridge && cargo test --release --test e2e journey_h264_real_media --features ove-decode/bundled,ove-encode/bundled
          else
            echo "NASA media cache not attached this run — journey skipped (recorded, not hidden)"
          fi
